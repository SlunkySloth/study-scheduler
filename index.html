<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d3a8a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ffd166' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ffd166'/%3E%3C/svg%3E">
<title>Study Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column "flight deck": the NOW card dominates, today's checklist under it, tabs for the long-range plan. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --ink:#131925; --muted:#5b6578; --line:#dbe0ea;
  --accent:#2b54d6; --accent-ink:#ffffff; --accent-soft:#e3e9fb;
  --won:#1d8549; --won-soft:#dcf2e5; --warn:#a96300; --warn-soft:#fcefd8; --bad:#c0342c; --bad-soft:#fbe3e1;
  --heat0:#e3e7ef; --heat1:#aec2f3; --heat2:#2b54d6;
  --now-bg:#1d3a8a; --now-ink:#ffffff; --now-sub:#c9d5f7; --now-btn:#ffd166; --now-btn-ink:#1a1a1a;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1119; --surface:#151b26; --ink:#e7ebf3; --muted:#98a2b6; --line:#263044;
  --accent:#7393f6; --accent-ink:#0a0f1d; --accent-soft:#1c2747;
  --won:#4fc581; --won-soft:#113021; --warn:#e4a84c; --warn-soft:#38280f; --bad:#f1736a; --bad-soft:#3b1716;
  --heat0:#1c2331; --heat1:#2d4282; --heat2:#7393f6;
  --now-bg:#1b2a5c; --now-ink:#eef2ff; --now-sub:#aebbe6; --now-btn:#ffd166; --now-btn-ink:#151515; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1119; --surface:#151b26; --ink:#e7ebf3; --muted:#98a2b6; --line:#263044;
  --accent:#7393f6; --accent-ink:#0a0f1d; --accent-soft:#1c2747;
  --won:#4fc581; --won-soft:#113021; --warn:#e4a84c; --warn-soft:#38280f; --bad:#f1736a; --bad-soft:#3b1716;
  --heat0:#1c2331; --heat1:#2d4282; --heat2:#7393f6;
  --now-bg:#1b2a5c; --now-ink:#eef2ff; --now-sub:#aebbe6; --now-btn:#ffd166; --now-btn-ink:#151515; color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:30px;font-weight:850;font-stretch:72%;letter-spacing:.01em;text-transform:uppercase;line-height:1}
h2{font-size:21px;font-weight:800;font-stretch:80%}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.top .date{font-size:13px;color:var(--muted);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip b{font-family:var(--f-mono);font-size:14px}
.chip.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}

/* now card */
.now{background:var(--now-bg);color:var(--now-ink);border-radius:14px;padding:22px;display:grid;gap:14px}
.now .eyebrow{color:var(--now-sub)}
.now .btn:not(.ghost){background:var(--now-btn);color:var(--now-btn-ink)}
.now h2{font-size:clamp(26px,6vw,40px);font-stretch:68%;font-weight:900;text-transform:uppercase;line-height:1.02}
.now .why{font-size:14.5px;max-width:60ch;color:var(--now-sub)}
.now .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:var(--r);padding:11px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.big{padding:14px 24px;font-size:17px;font-family:var(--f-display);font-weight:800;letter-spacing:.03em;text-transform:uppercase;font-stretch:85%}
.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor;opacity:.85}
.btn.small{padding:6px 12px;font-size:13px}
.btn.plain{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}

/* checklist */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.tick{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;background:transparent;padding:0}
.tick svg{width:15px;height:15px;stroke:var(--accent-ink);stroke-width:3;fill:none;opacity:0}
.item.done .tick{background:var(--won);border-color:var(--won)}
.item.done .tick svg{opacity:1}
.item.done .label{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.item .label{font-weight:600}
.item .sub{font-size:13px;color:var(--muted)}
.counter{display:flex;align-items:center;gap:6px}
.counter button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.counter .mono{min-width:46px;text-align:center;font-size:15px}
.bar{height:6px;border-radius:99px;background:var(--heat0);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.won-banner{background:var(--won-soft);color:var(--won);border-radius:var(--r);padding:10px 14px;font-weight:600}
.overdue{background:var(--bad-soft);color:var(--bad);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.overdue label{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:14px}
.overdue input{margin-top:4px;accent-color:var(--won)}

/* heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:2px}
.heat span{width:14px;height:14px;border-radius:3px;background:var(--heat0)}
.heat span.l1{background:var(--heat1)} .heat span.l2{background:var(--heat2)}
.heat span.future{background:transparent;border:1px dashed var(--line)}
.heat span.pre{opacity:.35}
.heat span.today{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* roadmap */
details.phase{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.phase+details.phase{margin-top:10px}
details.phase summary{list-style:none;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;cursor:pointer}
details.phase summary::-webkit-details-marker{display:none}
details.phase .meta{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;letter-spacing:.03em;text-transform:uppercase}
.pill.now{background:var(--accent);color:var(--accent-ink)}
.pill.done{background:var(--won-soft);color:var(--won)}
.pill.late{background:var(--bad-soft);color:var(--bad)}
.pill.soon{background:var(--heat0);color:var(--muted)}
.phase-body{padding:0 16px 14px;display:flex;flex-direction:column;gap:2px}
.gate{font-size:13.5px;background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.task{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}
.task:first-of-type{border-top:0}
.task input{margin-top:4px;width:17px;height:17px;accent-color:var(--won)}
.task.is-done span{color:var(--muted);text-decoration:line-through}
.task .due{font-size:12.5px;white-space:nowrap}
.task.late .due{color:var(--bad);font-weight:600}

/* schedule */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.mono{white-space:nowrap}
tr.is-now td{background:var(--accent-soft)}
.dates{display:flex;flex-direction:column}
.dateRow{display:grid;grid-template-columns:96px 1fr auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.dateRow:first-child{border-top:0}
.dateRow.past{opacity:.5}
.dateRow.next{background:var(--accent-soft);margin:0 -10px;padding:10px;border-radius:8px;border-top-color:transparent}
.dateRow .k{font-size:12px}

/* applications */
form.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
form.add label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
input[type=text],input[type=url],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.applist td .co{font-weight:600}
.applist select{padding:5px 6px;font-size:13px;width:auto}
.tier{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.del{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline}
.del.armed{color:var(--bad);font-weight:600}

/* focus overlay */
.focus{position:fixed;inset:0;background:var(--now-bg);color:var(--now-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:10;text-align:center}
.focus .clock{font-family:var(--f-mono);font-size:clamp(64px,20vw,148px);font-weight:600;letter-spacing:-.02em;line-height:1}
.focus .task-name{font-family:var(--f-display);font-weight:850;font-stretch:72%;text-transform:uppercase;font-size:clamp(22px,5vw,34px)}
.focus .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.focus .rule{max-width:44ch;font-size:14px;opacity:.8}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
.sync{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
/* streak freeze, levels, badges */
.heat span.fz{background:transparent;border:2px solid var(--heat2)}
.freeze{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:14px}
.level{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.level b{font-family:var(--f-display);font-weight:850;font-stretch:75%;font-size:18px;text-transform:uppercase}
.level .bar{flex:1;min-width:120px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.badge .medal{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:15px;background:var(--heat0);color:var(--muted)}
.badge.got .medal{background:var(--now-btn);color:var(--now-btn-ink)}
.badge.locked{opacity:.55}
.badge b{font-size:14px}
.badge span{font-size:12.5px;color:var(--muted)}
/* AWS chart and weekly report */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.report{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.delta{font-size:12.5px;font-weight:600}
.delta.up{color:var(--won)} .delta.down{color:var(--bad)} .delta.same{color:var(--muted)}
.verdict{border-radius:var(--r);padding:12px 14px;font-weight:600}
.verdict.up{background:var(--won-soft);color:var(--won)} .verdict.down{background:var(--bad-soft);color:var(--bad)} .verdict.same{background:var(--heat0);color:var(--ink)}
/* pipeline board */
.board{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px;min-width:0}
.col.over{outline:2px dashed var(--accent)}
.col h3{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13.5px;display:flex;flex-direction:column;gap:4px;cursor:grab;overflow-wrap:anywhere}
.card .mv{display:flex;justify-content:space-between;gap:6px}
.card .mv button{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px}
.card .mv button:disabled{visibility:hidden}
.promise{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding-bottom:14px;border-bottom:1px solid color-mix(in srgb,var(--now-sub) 35%,transparent)}
.promise input{flex:1;min-width:200px;background:transparent;border:1px solid var(--now-sub);color:var(--now-ink);border-radius:8px;padding:9px 10px}
.promise input::placeholder{color:var(--now-sub);opacity:.8}
.promise .promise-text{font-size:16px}
.now .btn.small{background:var(--now-btn);color:var(--now-btn-ink)}
.now .btn.small.ghost{background:transparent;color:inherit}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.signin{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:30;padding:max(16px,env(safe-area-inset-left,0px))}
.signin .box{max-width:420px;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Padmanaban's daily check-in</div>
      <h1>Study Scheduler</h1>
      <div class="date" id="today-date"></div>
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <section class="now" id="now" aria-live="polite"></section>

  <div class="grid2">
    <section class="panel" id="checklist"></section>
    <section class="panel" id="momentum"></section>
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="roadmap" id="tab-roadmap">Roadmap</button>
    <button class="tab" role="tab" data-tab="schedule" id="tab-schedule">Schedule and dates</button>
    <button class="tab" role="tab" data-tab="apps" id="tab-apps">Applications</button>
    <button class="tab" role="tab" data-tab="aws" id="tab-aws">AWS exams</button>
    <button class="tab" role="tab" data-tab="report" id="tab-report">Weekly report</button>
    <button class="tab" role="tab" data-tab="badges" id="tab-badges">Badges</button>
    <button class="tab" role="tab" data-tab="notes" id="tab-notes">Daily note</button>
  </nav>
  <section id="tabpanel"></section>
  <div class="sync" id="sync">Connecting to your saved progress…</div>
  <div class="foot">
    <button class="btn small plain" id="export">Download backup</button>
    <button class="btn small plain" id="import">Restore from backup</button>
    <input type="file" id="importfile" accept="application/json" hidden>
    <button class="btn small plain" id="signout" hidden>Sign out</button>
  </div>
</div>
<div class="signin" id="gate" hidden><div class="box">
  <h1>Study Scheduler</h1>
  <p class="muted" id="gate-msg">Sign in to load your streaks, applications and progress.</p>
  <button class="btn big" id="signin">Sign in with Google</button>
</div></div>

<div class="focus" id="focus" hidden></div>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, doc as fdoc, collection as fcol, setDoc, onSnapshot as fsnap } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, ALLOWED_EMAIL } from "./firebase-config.js";

/* ---------- the plan (dates are from your roadmap doc) ---------- */
const AWS_EXAM = "2026-12-17";
const PLAN_START = "2026-10-21";

const PHASES = [
  {id:"p0", name:"Phase 0: Reset", start:"2026-10-21", end:"2026-10-27", gate:"Every resume line marked green, yellow or red"},
  {id:"p1", name:"Phase 1: Own PyRaft", start:"2026-10-28", end:"2026-11-24", gate:"Explain leader election and log replication with no notes"},
  {id:"aws", name:"AWS track: Solutions Architect Associate", start:"2026-10-21", end:"2026-12-17", gate:"80%+ on 3 timed practice exams, then pass on Dec 17"},
  {id:"p2", name:"Phase 2: Flash-sale system", start:"2026-11-25", end:"2027-03-02", gate:"Published load test: 1M purchase attempts, zero oversold"},
  {id:"p3", name:"Phase 3: ML layer", start:"2027-03-03", end:"2027-04-20", gate:"Bot model serves under 20 ms p99, with an evaluation report"},
  {id:"p4", name:"Phase 4: Interview mode", start:"2027-04-21", end:"2027-06-01", gate:"Pass 2 mock interviews a week for 3 weeks"},
  {id:"p5", name:"Phase 5: Summer and next cycle", start:"2027-06-02", end:"2027-11-02", gate:"One offer, or 3 merged open-source PRs and a fresh application wave in August"},
];

const TASKS = [
  ["p0","Mark every resume line green, yellow or red","2026-10-27"],
  ["p0","Fix the employer name (Caprea vs Caprae) and pick one email for applications","2026-10-27"],
  ["p0","Start NeetCode 150 (Arrays and Hashing)","2026-10-27"],
  ["p0","Unsubscribe from irrelevant job alerts","2026-10-27"],
  ["p1","Read the Raft paper; draw the follower, candidate, leader state machine","2026-11-03"],
  ["p1","Rewrite leader election by hand, with tests for split votes","2026-11-10"],

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,"0");
const keyOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const daysBetween = (a,b) => Math.round((parseKey(b)-parseKey(a))/86400000);
const todayKey = () => keyOf(new Date());
const fmtDate = (k,opts={day:"numeric",month:"short"}) => parseKey(k).toLocaleDateString("en-IN",opts);
const minsOf = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const fmt12 = t => { let [h,m] = t.split(":").map(Number); const ap = h>=12?"PM":"AM"; h = h%12||12; return h+":"+pad(m)+" "+ap; };

/* Blocks for a given day, from the weekly schedule in your roadmap. */
function blocksFor(k){
  const dow = parseKey(k).getDay(); const aws = k <= AWS_EXAM;
  if (dow === 0) return [
    {key:"dsa", label:"LeetCode weekly contest", start:"08:00", end:"09:30"},
    {key:"apps", label:"5 applications", start:"16:00", end:"17:00"},
    {key:"review", label:"Weekly review", start:"17:00", end:"17:30"},
  ];
  if (dow === 6) return [
    ...(aws ? [{key:"aws", label:"AWS hands-on labs", start:"09:00", end:"11:00"},
               {key:"project", label:"Project deep work", start:"11:00", end:"13:00"}]
            : [{key:"project", label:"Project deep work", start:"09:00", end:"13:00"}]),
    {key:"apps", label:"5 applications + 2 problems", start:"15:00", end:"17:00"},
  ];
  return [
    {key:"dsa", label:"DSA: solve by hand", start:"06:30", end:"07:30"},
    {key:"apps", label:"5 tailored applications", start:"17:30", end:"18:30"},
    ...(aws ? [{key:"aws", label:"AWS study", start:"20:00", end:"21:00"},
               {key:"project", label:"Project: this week's checklist", start:"21:00", end:"22:00"}]
            : [{key:"project", label:"Project: this week's checklist", start:"20:00", end:"22:00"}]),
  ];
}
const WHY = {
  dsa:"The coding round decides whether anyone reads your projects. One problem, by hand, no peeking for 30 minutes.",
  apps:"Five today. Tailor three keywords from the posting and use the right resume (SDE or AIML).",
  aws:"One focused hour. Do the lab, don't just watch the video.",
  project:"Write it first, let AI review second. Never keep a line you can't explain.",
  review:"Tick the week's boxes, check the gate, plan next week. 30 minutes.",
};
/* What has to be done for a day to count as won. */
function requirements(k){
  const dow = parseKey(k).getDay(); const keys = new Set(blocksFor(k).map(b=>b.key));
  const out = [];
  if (keys.has("dsa") || dow===6) out.push({key:"dsa", label: dow===0 ? "Contest or 1 problem" : "DSA problems", target: dow===6 ? 2 : 1, kind:"count"});
  out.push({key:"apps", label:"Applications", target:5, kind:"apps"});
  if (keys.has("aws")) out.push({key:"aws", label:"AWS study hour", kind:"toggle"});
  if (keys.has("project")) out.push({key:"project", label:"Project block", kind:"toggle"});
  if (keys.has("review")) out.push({key:"review", label:"Weekly review", kind:"toggle"});
  return out;
}

function allApps(){ return Object.values(S.apps).flat().sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.created||0)-(a.created||0)); }
const appsOn = k => allApps().filter(a=>a.date===k).length;

/* ---------- scoring ---------- */
function progressOf(k){
  const d = dayOf(k); const req = requirements(k);
  const parts = req.map(r => r.kind==="count" ? Math.min(1,(d.dsa||0)/r.target)
                         : r.kind==="apps" ? Math.min(1, appsOn(k)/r.target)
                         : (d.done&&d.done[r.key]) ? 1 : 0);
  const sum = parts.reduce((a,b)=>a+b,0);
  return { ratio: req.length ? sum/req.length : 0, won: parts.every(p=>p>=1), any: sum>0 || (d.focus||0)>0 };
}
/* A frozen day keeps the streak alive. */
const keeps = k => progressOf(k).won || !!dayOf(k).frozen;
function streak(){
  const t = todayKey(); let n = 0; let k = keeps(t) ? t : addDays(t,-1);
  while (keeps(k)) { n++; k = addDays(k,-1); }
  return n;
}
function bestStreak(){
  const keys = Object.keys(S.days).sort(); if (!keys.length) return 0;
  let best=0, run=0, k = keys[0]; const end = todayKey();
  while (k <= end){ if (keeps(k)){ run++; best=Math.max(best,run);} else run=0; k = addDays(k,1); }
  return best;
}
const wonDays = () => Object.keys(S.days).filter(k => k <= todayKey() && progressOf(k).won).length;
/* One freeze earned per 7 won days, at most 3 banked. */
function freezeInfo(){
  const used = Object.values(S.days).filter(d=>d.frozen).length;
  const earned = Math.floor(wonDays()/7);
  return { earned, used, left: Math.max(0, Math.min(3, earned - used)) };
}

/* ---------- XP, levels, badges ---------- */
const sumDays = f => Object.values(S.days).reduce((a,d)=>a+(d[f]||0),0);
function xp(){

}
const LEVEL_NAMES = ["Starter","Grinder","Builder","Shipper","Engineer","Architect","Contender","Offer-ready"];
function levelOf(x){
  let lvl = 1, need = 100, acc = 0;
  while (x >= acc + need){ acc += need; lvl++; need = Math.round(need*1.35); }
  return { lvl, into: x-acc, need, name: LEVEL_NAMES[Math.min(lvl-1, LEVEL_NAMES.length-1)] };
}
function badgeList(){

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastTimer;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true,2600); }
const TICK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
function currentPhase(k){ return PHASES.filter(p=>p.id!=="aws" && k>=p.start && k<=p.end)[0] || (k < PLAN_START ? PHASES[0] : null); }

/* ---------- render: NOW card ---------- */
function isDone(k, key){
  const d = dayOf(k);
  if (key==="dsa") { const r = requirements(k).find(r=>r.key==="dsa"); return (d.dsa||0) >= (r?r.target:1); }
  if (key==="apps") return appsOn(k) >= 5;
  return !!(d.done && d.done[key]);
}
/* Missed-block rescue: a moved block keeps its key but gets a new time (max 60 min). */
const toHHMM = mm => pad(Math.floor(mm/60)) + ":" + pad(mm%60);
function effBlocks(k){
  const r = dayOf(k).rescue || {};
  return blocksFor(k).map(b => { if (!r[b.key]) return b;
    const dur = Math.min(60, minsOf(b.end)-minsOf(b.start));
    return {...b, start:r[b.key], end:toHHMM(minsOf(r[b.key])+dur), rescued:true}; })
    .sort((a,b)=>minsOf(a.start)-minsOf(b.start));
}
function findSlot(k, block, m){
  const dur = Math.min(60, minsOf(block.end)-minsOf(block.start));
  const busy = effBlocks(k).filter(b => b.key!==block.key && !isDone(k,b.key) && minsOf(b.end) > m);
  for (let s = Math.ceil((m+5)/30)*30; s + dur <= 23*60; s += 30){
    if (!busy.some(b => s < minsOf(b.end) && s+dur > minsOf(b.start))) return toHHMM(s);
  }
  return null;
}
/* Morning promise: one thing you commit to finishing today. */
function promiseHtml(t, m){
  const d = dayOf(t);
  if (!d.commit) return `<form class="promise" id="promiseform"><label for="promise-in" class="eyebrow" style="flex-basis:100%">Before you start: what's the one thing you'll finish today?</label>
    <input type="text" id="promise-in" placeholder="e.g. Rewrite leader election and pass the split-vote test" maxlength="140"><button class="btn small" type="submit">Promise it</button></form>`;
  const state = d.commitDone===true ? `<span class="pill done">Kept</span>` : d.commitDone===false ? `<span class="pill late">Not today</span>` : "";
  const ask = d.commitDone==null ? (m >= 21*60
      ? `<span class="eyebrow">Did you keep it?</span><button class="btn small" data-commit="yes">Yes</button><button class="btn small ghost" data-commit="no">Not today</button>`
      : `<button class="btn small ghost" data-commit="yes">Mark kept</button>`) : "";
  return `<div class="promise"><span class="eyebrow" style="flex-basis:100%">Today's promise</span><b class="promise-text">${esc(d.commit)}</b>${state}${ask}</div>`;
}
function renderNow(){
  const t = todayKey(); const now = new Date(); const m = now.getHours()*60+now.getMinutes();
  const blocks = effBlocks(t);
  const cur = blocks.find(b => m >= minsOf(b.start) && m < minsOf(b.end));
  const open = blocks.filter(b => !isDone(t,b.key));
  const next = blocks.find(b => minsOf(b.start) > m && !isDone(t,b.key));
  let eyebrow, title, why, primary, secondary = "";
  if (cur && !isDone(t,cur.key)) {
    eyebrow = `Right now · ${fmt12(cur.start)} to ${fmt12(cur.end)}`;
    title = cur.label; why = WHY[cur.key];
    const left = minsOf(cur.end) - m;
    primary = `<button class="btn big" data-start="${cur.key}" data-min="${Math.max(10,left)}">Start: ${left} min left in this block</button>`;
    secondary = `<button class="btn ghost" data-start="${cur.key}" data-min="5">Just 5 minutes</button>`;
  } else if (open.length) {
    const target = next || open[0];
    const lateOnes = open.filter(b => minsOf(b.end) <= m);
    eyebrow = next && !lateOnes.length ? `Next up at ${fmt12(next.start)}` : "Still open today";
    title = (lateOnes[0] || target).label; why = WHY[(lateOnes[0] || target).key];
    if (lateOnes.length && next) why = `${lateOnes.map(b=>b.label).join(", ")} slipped. Do one of them now, before ${fmt12(next.start)}.`;
    const pick = lateOnes[0] || target;
    primary = `<button class="btn big" data-start="${pick.key}" data-min="25">Start 25 minutes: ${esc(pick.label)}</button>`;
    secondary = `<button class="btn ghost" data-start="${pick.key}" data-min="5">Just 5 minutes</button>`;
    if (lateOnes.length){ const slot = findSlot(t, pick, m);
      if (slot) secondary += `<button class="btn ghost" data-rescue="${pick.key}" data-at="${slot}">Move it to ${fmt12(slot)}</button>`; }
  } else {
    eyebrow = "Today is done"; title = "Day won. Rest properly.";
    why = "Every block is ticked. Tomorrow's first block is the one that keeps the streak alive.";
    primary = "";
  }
  const focusToday = dayOf(t).focus||0;
  $("#now").innerHTML = promiseHtml(t, m) + `
    <div class="eyebrow">${esc(eyebrow)}</div>
    <h2>${esc(title)}</h2>
    <div class="why">${esc(why)}</div>
    <div class="row">${primary}${secondary}</div>
    <div class="eyebrow">Focused today: <span class="mono">${focusToday}</span> min</div>`;
}

/* ---------- render: today's checklist ---------- */
function renderChecklist(){
  const t = todayKey(); const d = dayOf(t); const req = requirements(t); const p = progressOf(t);
  const rows = req.map(r => {
    if (r.kind==="count") {
      const n = d.dsa||0; const done = n >= r.target;
      return `<div class="item ${done?"done":""}"><button class="tick" data-dsa-tick aria-label="Add one problem">${TICK}</button>
        <div><div class="label">${esc(r.label)}</div><div class="sub">Target ${r.target}. Solved by hand counts; copied doesn't.</div></div>
        <div class="counter"><button data-dsa="-1" aria-label="One fewer">−</button><span class="mono">${n}/${r.target}</span><button data-dsa="1" aria-label="One more">+</button></div></div>`;
    }
    if (r.kind==="apps") {
      const n = appsOn(t); const done = n >= 5;
      return `<div class="item ${done?"done":""}"><button class="tick" data-goto="apps" aria-label="Log an application">${TICK}</button>
        <div><div class="label">${n} of 5 applications</div>${openJobs().length?`<div class="sub">${openJobs().length} new jobs waiting in Applications</div>`:""}<div class="bar"><i style="width:${Math.min(100,n*20)}%"></i></div></div>
        <button class="btn small plain" data-goto="apps">Log one</button></div>`;
    }
    const done = !!(d.done&&d.done[r.key]);
    return `<div class="item ${done?"done":""}"><button class="tick" data-toggle="${r.key}" aria-pressed="${done}" aria-label="Mark ${esc(r.label)} done">${TICK}</button>
      <div><div class="label">${esc(r.label)}</div><div class="sub">${esc(effBlocks(t).filter(b=>b.key===r.key).map(b=>fmt12(b.start)+" to "+fmt12(b.end)).join(", "))}</div></div>
      ${done?"":`<button class="btn small plain" data-start="${r.key}" data-min="25">Start</button>`}</div>`;
  }).join("");
  const late = TASKS.filter(x => x.due < t && !S.tasks[x.id]).slice(0,3);
  const overdue = late.length ? `<div class="overdue"><b>Overdue from your roadmap</b>${late.map(x=>`<label><input type="checkbox" data-task="${x.id}"> <span>${esc(x.text)} <span class="mono">(due ${fmtDate(x.due)})</span></span></label>`).join("")}</div>` : "";
  const y = addDays(t,-1), fi = freezeInfo();
  const prevRun = (() => { let n=0, k=addDays(y,-1); while (keeps(k)) { n++; k=addDays(k,-1); } return n; })();
  const freeze = (!keeps(y) && prevRun>0) ? (fi.left>0
    ? `<div class="freeze"><span>You missed yesterday. Use a streak freeze to keep your ${prevRun}-day streak (${fi.left} left).</span><button class="btn small" data-freeze="${y}">Use a freeze</button></div>`
    : `<div class="freeze"><span>Yesterday broke your ${prevRun}-day streak. Win today to start a new one. You earn a freeze every 7 won days.</span></div>`) : "";
  $("#checklist").innerHTML = `
    <div class="panel-head"><h2>Today</h2><span class="mono muted">${Math.round(p.ratio*100)}%</span></div>
    ${p.won ? `<div class="won-banner">Day won. Your streak is safe.</div>` : ""}${freeze}
    <div class="items">${rows}</div>${overdue}`;
}

/* ---------- render: momentum (heatmap + stats) ---------- */
function renderMomentum(){
  const t = todayKey(); const weeks = 18;
  const d0 = parseKey(t); const startK = addDays(t, -(d0.getDay()) - (weeks-1)*7);
  let cells = "";
  for (let i=0;i<weeks*7;i++){
    const k = addDays(startK,i);
    if (k > t) { cells += `<span class="future" title="${fmtDate(k)}"></span>`; continue; }
    const p = progressOf(k); const fz = !p.won && dayOf(k).frozen; const lvl = p.won ? "l2" : fz ? "fz" : p.any ? "l1" : "";
    cells += `<span class="${lvl} ${k<PLAN_START?"pre":""} ${k===t?"today":""}" title="${fmtDate(k)}: ${p.won?"won":fz?"streak freeze":p.any?"partial":"nothing logged"}"></span>`;

function weekStats(from, to){
  const today = todayKey(); let planned=0, done=0, won=0, dsa=0, focus=0, kept=0;
  for (let k=from; k<=to && k<=today; k=addDays(k,1)){
    const req = requirements(k); const d = dayOf(k);
    planned += req.length;
    done += req.filter(r => r.kind==="count" ? (d.dsa||0)>=r.target : r.kind==="apps" ? appsOn(k)>=r.target : !!(d.done&&d.done[r.key])).length;
    if (progressOf(k).won) won++;
    dsa += d.dsa||0; focus += d.focus||0;
    if (d.commitDone===true) kept++;
  }
  const apps = allApps().filter(a=>a.date>=from && a.date<=to).length;
  return { planned, done, won, dsa, kept, focus: Math.round(focus/6)/10, apps, rate: planned ? Math.round(done/planned*100) : 0 };
}

  const row = (label, a, b, unit="") => { const d = Math.round((a-b)*10)/10; const cls = d>0?"up":d<0?"down":"same";

function startFocus(key, min){
  F = {key, min:Number(min), endsAt: Date.now()+min*60000, pausedLeft:null, day: todayKey()};
  try{ localStorage.setItem(FKEY, JSON.stringify(F)); }catch(e){}

function stopFocus(credit){
  if (F && credit){
    const usedMin = Math.round((F.min*60000 - Math.max(0,(F.pausedLeft ?? (F.endsAt-Date.now()))))/60000);
    if (usedMin>0){ const d = clone(dayOf(F.day)); d.focus = (d.focus||0)+usedMin; saveDay(F.day, d); }
  }
  F = null; try{ localStorage.removeItem(FKEY); }catch(e){}
  clearInterval(fTimer); $("#focus").hidden = true; document.title = "Study Scheduler";
}
function showFocus(){
  const el = $("#focus"); el.hidden = false; clearInterval(fTimer);
  const draw = () => {
    if (!F) return;
    const left = F.pausedLeft ?? Math.max(0, F.endsAt - Date.now());
    const mm = Math.floor(left/60000), ss = Math.floor(left%60000/1000);
    if (left <= 0) { finishFocus(); return; }
    el.innerHTML = `<div class="eyebrow" style="color:inherit;opacity:.7">Focus block · phone in another room</div>
      <div class="task-name">${esc(labelFor(F.key))}</div>
      <div class="clock" role="timer">${pad(mm)}:${pad(ss)}</div>
      <div class="rule">${esc(WHY[F.key]||"")}</div>
      <div class="row"><button class="btn ghost" id="f-pause">${F.pausedLeft!=null?"Resume":"Pause"}</button>
      <button class="btn ghost" id="f-quit">Stop and log the time</button></div>`;
    document.title = pad(mm)+":"+pad(ss)+" · "+labelFor(F.key);
  };
  draw(); fTimer = setInterval(draw, 1000);
}
function finishFocus(){
  clearInterval(fTimer);
  const key = F.key, k = F.day;
  const d = clone(dayOf(k)); d.focus = (d.focus||0) + F.min; saveDay(k, d);
  F = null; try{ localStorage.removeItem(FKEY); }catch(e){}
  document.title = "Study Scheduler";
  const act = key==="dsa" ? `<button class="btn big" id="f-dsa">I solved one: +1 problem</button>`
            : key==="apps" ? `<button class="btn big" id="f-apps">Log my applications</button>`
            : `<button class="btn big" id="f-mark" data-key="${key}">Mark ${esc(labelFor(key))} done</button>`;
  $("#focus").innerHTML = `<div class="task-name">Block finished</div><div class="rule">That counted. Log what you did while it's fresh.</div>
    <div class="row">${act}<button class="btn ghost" id="f-close">Close</button></div>`;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button, [data-task]"); if (!b) return;
  const t = todayKey();
  if (b.id==="export"){ exportBackup(); return; }
  if (b.id==="import"){ $("#importfile").click(); return; }
  if (b.id==="signin"){ signInWithPopup(auth, new GoogleAuthProvider()).catch(err => { $("#gate-msg").textContent = "Sign-in didn't finish (" + (err.code||"error") + "). Try again."; }); return; }
  if (b.id==="signout"){ signOut(auth); return; }
  if (b.dataset.start){ startFocus(b.dataset.start, b.dataset.min||25); return; }
  if (b.dataset.freeze){ const d = clone(dayOf(b.dataset.freeze)); d.frozen = true; saveDay(b.dataset.freeze, d); toast("Streak saved with a freeze."); return; }
  if (b.dataset.rescue){ const d = clone(dayOf(t)); d.rescue = {...(d.rescue||{}), [b.dataset.rescue]: b.dataset.at}; saveDay(t,d); toast(`Moved to ${fmt12(b.dataset.at)}. Show up for it.`); return; }
  if (b.dataset.commit){ const d = clone(dayOf(t)); d.commitDone = b.dataset.commit==="yes"; saveDay(t,d); toast(d.commitDone ? "Promise kept." : "Logged. Make tomorrow's promise smaller."); return; }
  if (b.dataset.view){ appView = b.dataset.view; try{localStorage.setItem("comeback-appview",appView);}catch(e){} renderApps(); return; }
  if (b.dataset.move){ if (b.dataset.to) setStatus(b.dataset.move, b.dataset.to); return; }
  if (b.dataset.awsDel){
    if (awsArmed !== b.dataset.awsDel){ awsArmed = b.dataset.awsDel; renderAws(); return; }
    S.aws = S.aws.filter(e=>e.id!==b.dataset.awsDel); awsArmed = null; saveAws(); toast("Score deleted."); return;
  }
  if (b.dataset.jobApply){
    const j = openJobs().find(x=>x.id===b.dataset.jobApply); if (!j) return;
    const month = t.slice(0,7);
    const entry = { id:"a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), date:t, created:Date.now(), company:j.company, role:j.title,
      tier:"Dream", resume: /machine learning|\bml\b|\bai\b|research|scientist|data/i.test(j.title) ? "AIML" : "SDE", link:j.url, status:"Applied", note:j.location };
    S.apps[month] = [...(S.apps[month]||[]), entry]; saveApps(month);
    S.jobstate = {...S.jobstate, [j.id]:"applied"}; saveJobState();
    const n = appsOn(t); toast(n>=5 ? "Logged. 5 today: applications done." : `Logged. ${n} of 5 today.`); return;
  }
  if (b.dataset.jobSkip){ S.jobstate = {...S.jobstate, [b.dataset.jobSkip]:"dismissed"}; saveJobState(); return; }
  if (b.hasAttribute("data-loadmail")){ loadJobsFile(true); return; }
  if (b.hasAttribute("data-jobs-all")){ showAllJobs = !showAllJobs; renderApps(); return; }
  if (b.dataset.toggle){ const d = clone(dayOf(t)); d.done = d.done||{}; d.done[b.dataset.toggle] = !d.done[b.dataset.toggle]; saveDay(t,d); if (d.done[b.dataset.toggle]) toast("Ticked. Keep the chain going."); return; }
  if (b.dataset.dsa){ const d = clone(dayOf(t)); d.dsa = Math.max(0,(d.dsa||0)+Number(b.dataset.dsa)); saveDay(t,d); return; }
  if (b.hasAttribute("data-dsa-tick")){ const d = clone(dayOf(t)); d.dsa = (d.dsa||0)+1; saveDay(t,d); return; }
  if (b.dataset.goto){ tab = b.dataset.goto; try{localStorage.setItem("comeback-tab",tab);}catch(e){} renderTabs(); $("#tabpanel").scrollIntoView({behavior:"smooth",block:"start"}); setTimeout(()=>{ const f=$("#f-co"); f&&f.focus(); },300); return; }
  if (b.dataset.tab){ tab = b.dataset.tab; try{localStorage.setItem("comeback-tab",tab);}catch(e){} renderTabs(); return; }
  if (b.dataset.del){
    if (armedDelete !== b.dataset.del){ armedDelete = b.dataset.del; renderApps(); return; }
    for (const m in S.apps){ const i = S.apps[m].findIndex(a=>a.id===b.dataset.del); if (i>=0){ S.apps[m] = S.apps[m].filter(a=>a.id!==b.dataset.del); armedDelete=null; saveApps(m); toast("Application deleted."); break; } }
    return;
  }
  if (b.id==="savenote"){ const d = clone(dayOf(t)); d.note = $("#note").value.trim(); saveDay(t,d); toast("Note saved."); return; }
  if (b.id==="f-pause"){ if (F.pausedLeft!=null){ F.endsAt = Date.now()+F.pausedLeft; F.pausedLeft=null; } else { F.pausedLeft = Math.max(0,F.endsAt-Date.now()); } try{localStorage.setItem(FKEY,JSON.stringify(F));}catch(e){} return; }
  if (b.id==="f-quit"){ stopFocus(true); toast("Time logged. Start again when you're ready."); return; }
  if (b.id==="f-close"){ $("#focus").hidden = true; return; }
  if (b.id==="f-dsa"){ const d = clone(dayOf(t)); d.dsa=(d.dsa||0)+1; saveDay(t,d); $("#focus").hidden=true; toast("+1 problem."); return; }
  if (b.id==="f-apps"){ $("#focus").hidden=true; tab="apps"; renderTabs(); $("#tabpanel").scrollIntoView({behavior:"smooth"}); return; }
  if (b.id==="f-mark"){ const d = clone(dayOf(t)); d.done=d.done||{}; d.done[b.dataset.key]=true; saveDay(t,d); $("#focus").hidden=true; toast("Done. Next block."); return; }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id==="importfile"){ const f = el.files && el.files[0]; el.value = ""; if (f) importBackup(f); return; }
  if (el.dataset.task){ if (el.checked) S.tasks[el.dataset.task] = todayKey(); else delete S.tasks[el.dataset.task]; saveTasks(); if (el.checked) toast("Roadmap task done."); return; }
  if (el.dataset.status){ for (const m in S.apps){ const a = (S.apps[m]||[]).find(a=>a.id===el.dataset.status); if (a){ S.apps[m] = S.apps[m].map(x=>x.id===a.id?{...x,status:el.value}:x); saveApps(m); toast("Status updated."); break; } } }
});
document.addEventListener("submit", e => {
  if (e.target.id === "awsform"){ e.preventDefault();
    const sc = Number($("#aw-score").value.replace("%","").trim());
    if (!(sc>=0 && sc<=100) || $("#aw-score").value.trim()===""){ toast("Enter a score between 0 and 100."); return; }
    S.aws = [...S.aws, {id:"x"+Date.now().toString(36), date:$("#aw-date").value||todayKey(), score:Math.round(sc), source:$("#aw-src").value.trim(), created:Date.now()}];
    saveAws(); toast(sc>=80 ? "Pass mark. Keep it there." : "Logged. Review every wrong answer."); return; }
  if (e.target.id === "promiseform"){ e.preventDefault();
    const v = $("#promise-in").value.trim(); if (!v) return; const t = todayKey(); const d = clone(dayOf(t));
    d.commit = v; delete d.commitDone; $("#promise-in").blur(); saveDay(t,d); toast("Promised. Now start."); return; }
  if (e.target.id !== "appform") return; e.preventDefault();
  const date = $("#f-date").value || todayKey(); const month = date.slice(0,7);
  const entry = { id: "a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), date, created: Date.now(),
    company: $("#f-co").value.trim(), role: $("#f-role").value.trim(), tier: $("#f-tier").value, resume: $("#f-res").value,
    link: $("#f-link").value.trim(), status: "Applied" };
  if (!entry.company || !entry.role) return;
  S.apps[month] = [...(S.apps[month]||[]), entry]; saveApps(month);
  const n = appsOn(todayKey()); toast(n>=5 ? "5 today. Applications done." : `${n} of 5 today. ${5-n} to go.`);
  setTimeout(()=>{ const f=$("#f-co"); f&&f.focus(); },50);
});

/* Pipeline board drag and drop (the arrow buttons do the same on phones). */
document.addEventListener("dragstart", e => { const c = e.target.closest && e.target.closest("[data-card]"); if (c){ e.dataTransfer.setData("text/plain", c.dataset.card); e.dataTransfer.effectAllowed = "move"; } });
document.addEventListener("dragover", e => { const col = e.target.closest && e.target.closest("[data-col]"); if (col){ e.preventDefault(); col.classList.add("over"); } });
document.addEventListener("dragleave", e => { const col = e.target.closest && e.target.closest("[data-col]"); if (col && !col.contains(e.relatedTarget)) col.classList.remove("over"); });
document.addEventListener("drop", e => { const col = e.target.closest && e.target.closest("[data-col]"); if (!col) return; e.preventDefault(); col.classList.remove("over");
  const id = e.dataTransfer.getData("text/plain"); if (id) setStatus(id, col.dataset.col); });

/* Re-render each minute so the NOW card follows the clock, and at midnight. */
setInterval(()=>{ if (!(document.activeElement && ["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName))) render(); }, 60000);

/* ---------- backup and restore ---------- */
function exportBackup(){
  const data = { exported: new Date().toISOString(), days:S.days, tasks:S.tasks, apps:S.apps, aws:S.aws, jobstate:S.jobstate };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], {type:"application/json"}));
  const a = document.createElement("a"); a.href = url; a.download = "study-scheduler-backup-" + todayKey() + ".json";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast("Backup downloaded. Keep it somewhere safe.");
}
async function importBackup(file){
  let j; try { j = JSON.parse(await file.text()); } catch(e){ toast("That file isn't a Study Scheduler backup."); return; }
  if (!j || typeof j.days !== "object"){ toast("That file isn't a Study Scheduler backup."); return; }
  S.days = j.days||{}; S.tasks = j.tasks||{}; S.apps = j.apps||{}; S.aws = j.aws||[]; S.jobstate = j.jobstate||{};
  if (live){
    const writes = [ ...Object.entries(S.days).map(([k,v]) => db.doc("days/"+k).set(v)),
      db.doc("meta/tasks").set({done:S.tasks}), ...Object.entries(S.apps).map(([m,v]) => db.doc("apps/"+m).set({entries:v})),
      db.doc("aws/exams").set({entries:S.aws}), db.doc("meta/jobstate").set({done:S.jobstate}) ];
    try { await Promise.all(writes); } catch(e){ toast("Restore partly failed. Try again."); return; }
  } else saveLocal();
  render(); toast("Backup restored.");
}

/* ---------- boot ---------- */
/* Each viewer's data lives under users/<their uid>/... ; the adapter keeps the app's short paths. */
function makeDb(fs, uid){
  const ref = p => { const s = p.split("/"); return s.length % 2 === 0 ? fdoc(fs, "users", uid, ...s) : fcol(fs, "users", uid, ...s); };
  const wrap = d => ({ id: d.id, exists: d.exists(), data: () => d.data() });
  return {
    doc: p => { const r = ref(p); return { set: v => setDoc(r, v), onSnapshot: (n, e) => fsnap(r, s => n(wrap(s)), e) }; },
    collection: p => { const r = ref(p); return { onSnapshot: (n, e) => fsnap(r, s => n({ docs: s.docs.map(wrap) }), e) }; },
  };
}
const configured = firebaseConfig && firebaseConfig.apiKey && !/PASTE/.test(firebaseConfig.apiKey);
let auth = null, unsubs = [];
loadLocal(); render(); loadJobsFile(false);
if (F) showFocus();
if (!configured){
  loaded = true;
  $("#sync").textContent = "Setup not finished: data is saved in this browser only until Firebase is connected.";
} else {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  const fs = initializeFirestore(app, { localCache: persistentLocalCache() });
  onAuthStateChanged(auth, user => {
    unsubs.forEach(u => u()); unsubs = [];
    if (!user){ live = false; $("#gate").hidden = false; $("#signout").hidden = true; return; }
    if (ALLOWED_EMAIL && (user.email||"").toLowerCase() !== ALLOWED_EMAIL.toLowerCase()){
      $("#gate-msg").textContent = "This Study Scheduler is private to its owner."; signOut(auth); return;
    }
    $("#gate").hidden = true; $("#signout").hidden = false;
    db = makeDb(fs, user.uid); live = true; loaded = false;
    S.days = {}; S.tasks = {}; S.apps = {}; S.aws = []; S.jobstate = {}; render();
    const arrived = new Set(); const mark = name => { arrived.add(name); if (arrived.size >= 3) loaded = true; };
    const fail = () => { $("#sync").textContent = "Lost connection to saved progress. Reload the page to reconnect."; };
    unsubs.push(db.collection("days").onSnapshot(snap => { const o={}; snap.docs.forEach(d=>o[d.id]=d.data()); S.days=o; mark("days"); render(); $("#sync").textContent = "Signed in as " + user.email + ". Progress saved to your account."; }, fail));
    unsubs.push(db.doc("meta/tasks").onSnapshot(snap => { S.tasks = snap.exists ? clone((snap.data()||{}).done) : {}; mark("tasks"); render(); }, fail));
    unsubs.push(db.collection("apps").onSnapshot(snap => { const o={}; snap.docs.forEach(d=>o[d.id]=clone((d.data()||{}).entries||[])); S.apps=o; mark("apps"); render(); }, fail));
    unsubs.push(db.doc("aws/exams").onSnapshot(snap => { S.aws = snap.exists ? clone((snap.data()||{}).entries||[]) : []; render(); }, () => {}));
    unsubs.push(db.doc("meta/jobstate").onSnapshot(snap => { S.jobstate = snap.exists ? clone((snap.data()||{}).done) : {}; render(); }, () => {}));
  });
}
